{{- if and (not .Values.demo) (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "radar.githubSecretName" . }}
  labels:
    {{- include "radar.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* --set-file keeps a file's trailing newline, which would corrupt a one-line secret. */}}
  GITHUB_APP_ID: {{ .Values.github.appId | toString | trim | quote }}
  GITHUB_APP_CLIENT_ID: {{ .Values.github.clientId | trim | quote }}
  GITHUB_APP_CLIENT_SECRET: {{ .Values.github.clientSecret | trim | quote }}
  GITHUB_APP_PRIVATE_KEY: {{ .Values.github.privateKey | quote }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.github.webhookSecret | trim | quote }}
---
{{- end }}
{{- if not .Values.demo }}
{{- $name := include "radar.sessionSecretName" . }}
{{- $held := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "radar.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.sessionSecret }}
  RADAR_SESSION_SECRET: {{ .Values.sessionSecret | b64enc | quote }}
  {{- else if and $held $held.data (index $held.data "RADAR_SESSION_SECRET") }}
  RADAR_SESSION_SECRET: {{ index $held.data "RADAR_SESSION_SECRET" | quote }}
  {{- else }}
  RADAR_SESSION_SECRET: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
