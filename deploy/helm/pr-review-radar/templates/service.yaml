apiVersion: v1
kind: Service
metadata:
  name: {{ include "radar.fullname" . }}
  labels:
    {{- include "radar.labels" . | nindent 4 }}
  {{- if .Values.gke.backendConfig }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "{{ include "radar.fullname" . }}"}'
  {{- end }}
spec:
  selector:
    {{- include "radar.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.gke.backendConfig }}
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "radar.fullname" . }}
  labels:
    {{- include "radar.labels" . | nindent 4 }}
spec:
  # Server-Sent Events hold a response open. The default 30 second backend timeout would cut every stream.
  timeoutSec: 3600
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 8080
{{- end }}
