org: acme
host: radar.example.com
github:
  appId: 12345
  clientId: Iv1.example
  clientSecret: not-a-real-secret
  privateKey: |
    -----BEGIN RSA PRIVATE KEY-----
    not-a-real-key
    -----END RSA PRIVATE KEY-----
  webhookSecret: not-a-real-secret
ingress:
  className: nginx
  tlsSecretName: radar-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
env:
  RADAR_TIME_ZONE: America/Los_Angeles
  RADAR_REREQUEST_ENABLED: true
  RADAR_RECONCILE_SECONDS: 120
