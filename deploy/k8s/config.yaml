apiVersion: v1
kind: ConfigMap
metadata:
  name: radar-config
data:
  RADAR_ORG: "atum"
  RADAR_BASE_URL: "https://radar.internal.example.com"
  RADAR_TIME_ZONE: "America/Los_Angeles"
  RADAR_PRIORITY_LABELS: "priority,urgent,hotfix"
  RADAR_BOT_LOGINS: "renovate,dependabot,github-actions"
  RADAR_REPO_DENYLIST: ""
  RADAR_HELP_WANTED_AFTER_HOURS: "24"
  RADAR_RECONCILE_SECONDS: "300"
  RADAR_REREQUEST_ENABLED: "false"
