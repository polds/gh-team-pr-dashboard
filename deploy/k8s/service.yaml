apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: radar-backend
spec:
  # Server-Sent Events hold a response open. The default 30 second backend timeout would cut every stream.
  timeoutSec: 3600
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: radar
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "radar-backend"}'
spec:
  selector:
    app: radar
  ports:
    - name: http
      port: 80
      targetPort: http
