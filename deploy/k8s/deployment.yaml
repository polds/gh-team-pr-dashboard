apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar
  labels:
    app: radar
spec:
  # The board lives in memory, so exactly one replica runs. See docs/design.md.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radar
  template:
    metadata:
      labels:
        app: radar
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: radar
          image: REGION-docker.pkg.dev/PROJECT/REPOSITORY/pr-review-radar:TAG
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: radar-config
            # Created by hand or by your secret manager. Keys are listed in docs/runbook.md.
            - secretRef:
                name: radar-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: radar-data
        - name: tmp
          emptyDir: {}
