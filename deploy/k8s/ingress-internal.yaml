# The board. Reachable only from inside the network.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radar-internal
  annotations:
    kubernetes.io/ingress.class: gce-internal
spec:
  rules:
    - host: radar.internal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radar
                port:
                  name: http
