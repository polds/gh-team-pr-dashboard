# GitHub has to reach the webhook receiver from the internet. This ingress exposes that one path and nothing else.
# The receiver rejects any request without a valid X-Hub-Signature-256 header, and any body over 25 MB.
# Attach a Cloud Armor policy that allows only the "hooks" ranges from https://api.github.com/meta.
# If inbound traffic from GitHub is not allowed at all, delete this file from kustomization.yaml and set
# RADAR_RECONCILE_SECONDS to 60. The board then updates within a minute, not within seconds.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: radar-webhook
spec:
  domains:
    - radar-hooks.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radar-webhook
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.allow-http: "false"
    networking.gke.io/managed-certificates: radar-webhook
spec:
  rules:
    - host: radar-hooks.example.com
      http:
        paths:
          - path: /webhooks/github
            pathType: Exact
            backend:
              service:
                name: radar
                port:
                  name: http
